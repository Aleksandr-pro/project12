name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Ensure Android SDK 34 is available
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm cmdline-tools.zip
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Gradle 8.9
        run: |
          curl -fL -sS https://github.com/gradle/gradle-distributions/releases/download/v8.9.0/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/gradle-8.9-bin.zip"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          if ! gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log; then
            ERR_MSG=$(grep -E "(FAILURE:|What went wrong:|^\* | > |e: file:|error: |Exception)" build-output.log | head -n 25 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle Build Error::${ERR_MSG}"
            tail -n 120 build-output.log
            exit 1
          fi
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1 >/dev/null 2>&1; then
            gh release upload v2.1 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v2.1 app/build/outputs/apk/debug/app-debug.apk \
              --latest \
              --title "Помощник AI v2.1 — Исправление приёма речи и индикатор микрофона" \
              --notes "Исправлен захват микрофона на Android 12–15, добавлен автовыбор сервисов речи Google, живая шкала уровня голоса и гарантированный системный голосовой ввод по кнопке."
          fi
